<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="description" content="A private PDF toolbox that runs entirely in your browser." />
    <title>LocalPDF</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#">LOCAL<span>PDF</span></a>
      <p>Private by default · Your files never leave this device</p>
    </header>

    <main>
      <div id="tools-page">
        <section class="hero">
          <h1>Everyday PDF tools. <em>Entirely yours.</em></h1>
          <p class="intro">Merge, split, organize, optimize, and turn images into PDFs. Everything happens locally in your browser.</p>
        </section>

        <section class="tools" aria-label="Document tools">
          <button class="tool" data-tool="merge"><i data-lucide="squares-unite"></i><strong>Merge PDF</strong><small>Combine files in order</small></button>
          <button class="tool" data-tool="split"><i data-lucide="square-split-horizontal"></i><strong>Split PDF</strong><small>Extract selected pages</small></button>
          <button class="tool" data-tool="organize"><i data-lucide="list-restart"></i><strong>Organize PDF</strong><small>Reorder or remove pages</small></button>
          <button class="tool" data-tool="images"><i data-lucide="images"></i><strong>Images to PDF</strong><small>JPG and PNG files</small></button>
          <button class="tool" data-tool="compress"><i data-lucide="minimize-2"></i><strong>Optimize PDF</strong><small>Clean document structure</small></button>
          <button class="tool" data-tool="protect"><i data-lucide="lock-keyhole"></i><strong>Protect PDF</strong><small>Add a password</small></button>
          <button class="tool" data-tool="unlock"><i data-lucide="lock-keyhole-open"></i><strong>Unlock PDF</strong><small>Remove a password</small></button>
          <button class="tool" data-tool="rotate"><i data-lucide="rotate-cw"></i><strong>Rotate PDF</strong><small>Rotate selected pages</small></button>
          <button class="tool" data-tool="page-numbers"><i data-lucide="list-ordered"></i><strong>Page Numbers</strong><small>Number PDF pages</small></button>
          <button class="tool" data-tool="watermark"><i data-lucide="stamp"></i><strong>Watermark PDF</strong><small>Add a text watermark</small></button>
          <button class="tool" data-tool="crop"><i data-lucide="crop"></i><strong>Crop PDF</strong><small>Trim page margins</small></button>
          <button class="tool" data-tool="repair"><i data-lucide="wrench"></i><strong>Repair PDF</strong><small>Rewrite document structure</small></button>
          <button class="tool" data-tool="pdf-word"><span class="conversion-icon"><i data-lucide="file-type-2"></i><i data-lucide="arrow-right"></i><i data-lucide="file-text"></i></span><strong>PDF to Word</strong><small>Extract editable text</small></button>
          <button class="tool" data-tool="word-pdf"><span class="conversion-icon"><i data-lucide="file-text"></i><i data-lucide="arrow-right"></i><i data-lucide="file-type-2"></i></span><strong>Word to PDF</strong><small>DOCX text to PDF</small></button>
          <button class="tool" data-tool="pdf-powerpoint"><span class="conversion-icon"><i data-lucide="file-type-2"></i><i data-lucide="arrow-right"></i><i data-lucide="presentation"></i></span><strong>PDF to PowerPoint</strong><small>One slide per page</small></button>
          <button class="tool" data-tool="powerpoint-pdf"><span class="conversion-icon"><i data-lucide="presentation"></i><i data-lucide="arrow-right"></i><i data-lucide="file-type-2"></i></span><strong>PowerPoint to PDF</strong><small>Slide text to PDF</small></button>
          <button class="tool" data-tool="pdf-excel"><span class="conversion-icon"><i data-lucide="file-type-2"></i><i data-lucide="arrow-right"></i><i data-lucide="sheet"></i></span><strong>PDF to Excel</strong><small>Text and simple tables</small></button>
          <button class="tool" data-tool="excel-pdf"><span class="conversion-icon"><i data-lucide="sheet"></i><i data-lucide="arrow-right"></i><i data-lucide="file-type-2"></i></span><strong>Excel to PDF</strong><small>Worksheets to PDF</small></button>
        </section>
      </div>

      <section class="workspace" id="tool-page" hidden>
        <button class="back-button" id="back-button" type="button"><i data-lucide="arrow-left"></i><span>Back</span></button>
        <div class="workspace-head">
          <h2 id="tool-title">Merge PDF</h2>
          <p id="tool-description"></p>
        </div>
        <div class="dropzone" id="dropzone" tabindex="0" role="button">
          <input type="file" id="file-input" hidden multiple accept="application/pdf" />
          <i class="upload-icon" data-lucide="upload"></i>
          <h3 id="drop-title">Drop PDFs here</h3>
          <p id="drop-hint">or click to choose files</p>
        </div>
        <div class="file-area" id="file-area" hidden>
          <div class="file-list" id="file-list"></div>
          <div class="file-controls">
            <button class="add-more" id="add-more" type="button"><i data-lucide="upload"></i> Add more files</button>
            <button class="primary" id="process-button" disabled><span id="process-label">Merge and download</span><i data-lucide="download"></i></button>
          </div>
        </div>
        <div class="options" id="options"></div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
